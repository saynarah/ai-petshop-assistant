[project]
name = "ai-petshop-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saynarah.nabuco", email = "saynarah.nabuco@revelo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "fastapi[standart]>=0.163.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-petshop-assistant = "ai_petshop_assistant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/api"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "external: tests requiring external services such as Pinecone and OpenAI"
]
